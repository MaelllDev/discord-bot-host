name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: typecheck · tests · build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (backend, frontend and tests)
        run: npm run typecheck

      - name: Tests (backend + frontend render tests)
        run: npm test

      - name: Production build
        run: npm run build

      - name: Installer behaviour tests (throwaway container)
        run: bash scripts/tests/install.test.sh

      - name: Release workflow tests (source synchronisation)
        run: bash scripts/tests/release.test.sh

      - name: Repository hygiene
        run: |
          set -e
          # Nothing that belongs to a running installation may be tracked.
          if git ls-files | grep -E '(^|/)(node_modules|dist|data|uploads|releases|backups)(/|$)'; then
            echo "::error::build or runtime paths are tracked in git"
            exit 1
          fi
          if git ls-files | grep -E '(^|/)\.env$|\.db$|\.session-secret$|\.initial-password$'; then
            echo "::error::secret or database files are tracked in git"
            exit 1
          fi
          echo "repository is clean"
